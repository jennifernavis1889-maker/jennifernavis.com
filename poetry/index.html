.nav-right{display:flex;align-items:center;gap:18px}.links{display:flex;gap:22px;font-size:.92rem}.links a:hover{color:var(--accent)}
.theme-toggle{display:inline-flex;align-items:center;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.theme-toggle button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.78rem;font-weight:600;padding:7px 10px;border-radius:999px;cursor:pointer}
.theme-toggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

main{padding:78px 0 100px}
.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:.75rem;color:var(--accent);font-weight:600}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
.tag{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.date{color:var(--muted);font-size:.9rem;margin-top:4px}
.card h2{font-size:2.35rem;line-height:1.05;margin:16px 0 10px}.card p{color:var(--muted)}.read{font-weight:600}

@media(max-width:760px){.links{display:none}main{padding-top:54px}.nav-right{gap:8px}.theme-toggle button{padding:7px 9px}}

<script>
document.getElementById('year').textContent=new Date().getFullYear();
const themeButtons=document.querySelectorAll('[data-theme-choice]');
function applyReadingTheme(theme){
document.documentElement.dataset.theme=theme;
try{localStorage.setItem('reading-theme',theme)}catch(e){}
themeButtons.forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.themeChoice===theme)));
}
applyReadingTheme(document.documentElement.dataset.theme||'day');
themeButtons.forEach(btn=>btn.addEventListener('click',()=>applyReadingTheme(btn.dataset.themeChoice)));
</script>
